name: Scrape jobs and deploy dashboard

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scraper.py --export-json

      - name: Commit updated jobs data
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/jobs.json data/jobs.csv
          git diff --cached --quiet || git commit -m "Update job feed $(date -u +%F)"
          git push

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
